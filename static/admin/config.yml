backend:
  name: github
  repo: Genghis1227/PromoteLiberty.org
  branch: main
  base_url: https://promoteliberty.org
  auth_endpoint: /api/auth

# Editorial Workflow enables Drafts -> In Review -> Published stages
publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Articles & Op-Eds"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Authors", name: "authors", widget: "list", default: ["PromoteLiberty Editorial"] }
      - { label: "Description / Summary", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: ["liberty", "policy"] }
      - { label: "Show Table of Contents", name: "showTableOfContents", widget: "boolean", default: true, required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

  - name: "authors"
    label: "Author Profiles"
    folder: "data/authors"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Headline / Title", name: "headline", widget: "string", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Profile Picture", name: "image", widget: "image", required: false }
